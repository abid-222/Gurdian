# Files hashed by File Vault. ~ = your home, * = glob. Your own additions live in data/watchlist.user.conf.
# --- Linux ---
/etc/passwd
/etc/group
/etc/sudoers
/etc/sudoers.d/*
/etc/hosts
/etc/ssh/sshd_config
/etc/crontab
/etc/fstab
/etc/environment
/etc/profile
/etc/bash.bashrc
/etc/ld.so.preload
~/.bashrc
~/.profile
~/.bash_profile
~/.ssh/authorized_keys
~/.ssh/config
# --- Windows (read through /mnt/c) ---
/mnt/c/Windows/System32/drivers/etc/hosts
/mnt/c/Users/*/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1
/mnt/c/Users/*/Documents/PowerShell/Microsoft.PowerShell_profile.ps1
